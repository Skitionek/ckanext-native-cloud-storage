#
# CKAN integration test configuration for ckanext-native-cloud-storage.
#
# This file is used by the pytest-ckan plugin (bundled with CKAN core) to
# spin up a real CKAN application/config for every test in
# ckanext/native_cloud_storage/tests/ -- CKAN_INI must be set even for the
# plain unit tests, because CKAN's pytest plugin loads config eagerly at
# session start regardless of which tests are selected.
#
# Setup (one-time):
#
#   1. Install the package with its dev/test extras. CKAN's own runtime
#      pins (Flask, SQLAlchemy, etc.) live behind the "requirements" extra
#      of the ckan wheel itself -- NOT behind this package's [dev] extra --
#      so install both. psycopg2 needs pg_config to build from source; use
#      psycopg2-binary instead if you don't have the Postgres dev headers:
#
#        pip install psycopg2-binary
#        pip install -e ".[dev]"
#        python -c "
#        import importlib.metadata as m
#        for r in m.metadata('ckan').get_all('Requires-Dist'):
#            if 'extra == \"requirements\"' in r and not r.startswith('psycopg2=='):
#                print(r.split(';')[0].strip())
#        " > /tmp/ckan_reqs.txt
#        pip install -r /tmp/ckan_reqs.txt
#
#   2. Start throwaway Postgres/Solr/Redis containers:
#
#        docker run -d --name ckan_test_pg -e POSTGRES_USER=ckan_default \
#            -e POSTGRES_PASSWORD=pass -e POSTGRES_DB=ckan_test \
#            -p 55432:5432 postgres:16-alpine
#        docker run -d --name ckan_test_redis -p 56379:6379 redis:7-alpine
#        docker run -d --name ckan_test_solr -p 58983:8983 ckan/ckan-solr:2.12-solr9
#
#   3. Create the datastore database/role once:
#
#        docker exec ckan_test_pg psql -U ckan_default -d postgres \
#            -c "CREATE DATABASE datastore_test;"
#        docker exec ckan_test_pg psql -U ckan_default -d postgres \
#            -c "CREATE USER datastore_default WITH PASSWORD 'pass';"
#
#   4. Initialize the CKAN test database (also creates ckan.storage_path
#      below if missing):
#
#        mkdir -p /tmp/ckan_test_storage
#        CKAN_INI=test.ini ckan -c test.ini db init
#
# Run the ENTIRE suite (unit + CKAN-fixture-backed integration tests) with
# a single command:
#
#   CKAN_INI=test.ini pytest ckanext/native_cloud_storage/tests/
#
# To run only the fast unit tests (no CKAN app/db fixtures spun up, but
# CKAN_INI is still required -- see note above):
#
#   CKAN_INI=test.ini pytest -m "not integration" ckanext/native_cloud_storage/tests/
#
# CI runs the full suite the same way -- see .github/workflows/test.yml.

[DEFAULT]

[app:main]
use = egg:ckan
debug = false
testing = true

SECRET_KEY = This_is_a_secret_or_is_it

sqlalchemy.url = postgresql://ckan_default:pass@localhost:55432/ckan_test

ckan.datastore.write_url = postgresql://ckan_default:pass@localhost:55432/datastore_test
ckan.datastore.read_url = postgresql://datastore_default:pass@localhost:55432/datastore_test

solr_url = http://127.0.0.1:58983/solr/ckan

ckan.redis.url = redis://localhost:56379/1

ckan.files.default_storages.default = test
ckan.files.storage.test.type = ckan:memory

# Required by AzureBlobStorage.migrate_existing_files (falls back to
# /var/lib/ckan/default if unset, but CKAN's config loader here returns
# None rather than the declared placeholder unless it's set explicitly).
# Must be writable: ckan.lib.uploader.Upload.__init__ creates
# <storage_path>/storage/uploads/<object_type> on every AzureBlobStorage()
# construction.
ckan.storage_path = /tmp/ckan_test_storage

ckan.auth.user_create_organizations = true
ckan.auth.user_create_groups = true
ckan.auth.create_user_via_api = false
ckan.auth.create_user_via_web = false
ckan.auth.create_dataset_if_not_in_organization = true
ckan.auth.anon_create_dataset = false

ckan.cache_enabled = False

ckan.site_id = test.ckan.net
ckan.site_title = CKAN
ckan.site_url = http://test.ckan.net
SESSION_COOKIE_DOMAIN = test.ckan.net

ckan.plugins = native_cloud_storage

WTF_CSRF_ENABLED = false

ckanext.native_cloud_storage.azure.use_emulator = true
ckanext.native_cloud_storage.azure.file_system_name = test-filesystem
ckanext.native_cloud_storage.azure.servicebus_queue_name = test-file-events

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
