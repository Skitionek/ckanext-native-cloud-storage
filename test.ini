#
# CKAN integration test configuration for ckanext-native-cloud-storage.
#
# This file is used by the pytest-ckan plugin (bundled with CKAN core) to
# spin up a real CKAN application/config for the integration tests in
# ckanext/native_cloud_storage/tests/test_integration.py.
#
# It expects Postgres, Solr and Redis to be reachable at the addresses
# below. For local development you can start throwaway containers, e.g.:
#
#   docker run -d --name ckan_test_pg -e POSTGRES_USER=ckan_default \
#       -e POSTGRES_PASSWORD=pass -e POSTGRES_DB=ckan_test \
#       -p 55432:5432 postgres:16-alpine
#   docker run -d --name ckan_test_redis -p 56379:6379 redis:7-alpine
#   docker run -d --name ckan_test_solr -p 58983:8983 ckan/ckan-solr:2.12-solr9
#
# Then also create the datastore database/role once:
#   docker exec ckan_test_pg psql -U ckan_default -d postgres \
#       -c "CREATE DATABASE datastore_test;"
#   docker exec ckan_test_pg psql -U ckan_default -d postgres \
#       -c "CREATE USER datastore_default WITH PASSWORD 'pass';"
#
# Run with:
#   CKAN_INI=test.ini pytest -m integration \
#       ckanext/native_cloud_storage/tests/test_integration.py
#
# (Task t_622bac48 will wire this into a single documented/pinned CI command.)

[DEFAULT]

[app:main]
use = egg:ckan
debug = false
testing = true

SECRET_KEY = This_is_a_secret_or_is_it

sqlalchemy.url = postgresql://ckan_default:pass@localhost:55432/ckan_test

ckan.datastore.write_url = postgresql://ckan_default:pass@localhost:55432/datastore_test
ckan.datastore.read_url = postgresql://datastore_default:pass@localhost:55432/datastore_test

solr_url = http://127.0.0.1:58983/solr/ckan

ckan.redis.url = redis://localhost:56379/1

ckan.files.default_storages.default = test
ckan.files.storage.test.type = ckan:memory

ckan.auth.user_create_organizations = true
ckan.auth.user_create_groups = true
ckan.auth.create_user_via_api = false
ckan.auth.create_user_via_web = false
ckan.auth.create_dataset_if_not_in_organization = true
ckan.auth.anon_create_dataset = false

ckan.cache_enabled = False

ckan.site_id = test.ckan.net
ckan.site_title = CKAN
ckan.site_url = http://test.ckan.net
SESSION_COOKIE_DOMAIN = test.ckan.net

ckan.plugins = native_cloud_storage

WTF_CSRF_ENABLED = false

ckanext.native_cloud_storage.azure.use_emulator = true
ckanext.native_cloud_storage.azure.file_system_name = test-filesystem
ckanext.native_cloud_storage.azure.servicebus_queue_name = test-file-events

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
