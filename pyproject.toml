[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ckanext-native-cloud-storage"
version = "0.1.0"
description = "CKAN extension for native cloud storage with Azure support"
authors = [
    { name = "Skitionek" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["CKAN", "Azure", "Cloud", "Storage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    # CKAN support policy: this extension targets CKAN >=2.12.0, which
    # requires Python >=3.10 (see requires-python above) -- the two
    # floors are intentionally aligned.
    "ckan>=2.12.0",
    "azure-storage-file-datalake>=12.25.0,<13.0.0",
    "azure-servicebus>=7.14.3,<8.0.0",
    "azure-identity>=1.25.3,<2.0.0",
    "azure-core>=1.41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-factoryboy>=2.7.0",
    "factory-boy>=3.3.0",
    "flake8>=7.3.0",
    "black>=26.5.1",
    "responses>=0.26.2",
    "tomli>=2.0.1; python_version < '3.11'",
    "build>=1.2.1",
    "twine>=5.1.1",
    # Needed to run the CKAN-fixture-backed integration tests in
    # ckanext/native_cloud_storage/tests/test_integration.py. These rely
    # on CKAN's own bundled pytest plugin (ckan.tests.pytest_ckan), which
    # in turn needs pytest-factoryboy -- and pytest-factoryboy pulls in
    # `inflection` as a transitive dependency that is not always resolved
    # automatically; pin it explicitly to avoid
    # `ModuleNotFoundError: No module named 'inflection'` at collection time.
    "pytest-factoryboy>=2.8.1",
    "inflection>=0.5.1",
]

[project.urls]
Homepage = "https://github.com/Skitionek/ckanext-native-cloud-storage"

[project.entry-points."ckan.plugins"]
native_cloud_storage = "ckanext.native_cloud_storage.plugin:NativeCloudStoragePlugin"

[project.entry-points."ckan.click_commands"]
native_cloud_storage = "ckanext.native_cloud_storage.commands:get_commands"

[project.entry-points."babel.extractors"]
ckan = "ckan.lib.extract:extract_ckan"

[tool.setuptools]
packages = ["ckanext.native_cloud_storage"]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["ckanext/native_cloud_storage/tests"]
markers = [
    "slow: marks tests that build/install the package (deselect with -m 'not slow')",
    "integration: CKAN-fixture-backed tests needing a real CKAN app + Postgres/Solr/Redis (see ckanext/native_cloud_storage/tests/test_integration.py and test.ini for setup/run instructions)",
]

[tool.black]
target-version = ["py310"]
