name: Packaging metadata check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: read-all

jobs:
  packaging-metadata:
    name: Build, twine check, and metadata consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with dev extras
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run packaging metadata regression tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest -p pytest_cov ckanext/native_cloud_storage/tests/test_packaging_metadata.py -v
