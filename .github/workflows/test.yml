name: Test suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: read-all

jobs:
  test:
    name: "Test (Python ${{ matrix.python-version }}, CKAN ${{ matrix.ckan-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml pins ckan>=2.12.0 / requires-python>=3.10 -- this
        # matrix covers every Python version CKAN 2.12 supports (3.10-3.12,
        # see CKAN's own classifiers) against the one CKAN release that
        # currently satisfies our floor. Add a row here once a newer CKAN
        # minor is released and this package's floor is bumped to match.
        python-version: ["3.10", "3.11", "3.12"]
        ckan-version: ["2.12.0"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ckan_default
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: ckan_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      solr:
        image: ckan/ckan-solr:2.12-solr9
        ports:
          - 58983:8983

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          # CKAN's own runtime pins live behind the "requirements" extra of
          # the ckan wheel itself, not behind ckanext-native-cloud-storage's
          # [dev] extra -- install both. psycopg2 (source) needs pg_config,
          # which isn't available on the runner, so use psycopg2-binary and
          # skip the source psycopg2 pin from ckan[requirements].
          pip install psycopg2-binary
          pip install -e ".[dev]" "ckan==${{ matrix.ckan-version }}"
          python - <<'PYEOF' > /tmp/ckan_reqs.txt
          import importlib.metadata as m
          for r in m.metadata("ckan").get_all("Requires-Dist"):
              if 'extra == "requirements"' not in r:
                  continue
              pkg = r.split(";")[0].strip()
              if pkg.lower().startswith("psycopg2=="):
                  continue
              print(pkg)
          PYEOF
          pip install -r /tmp/ckan_reqs.txt

      - name: Create datastore database/role
        run: |
          export PGPASSWORD=pass
          psql -h localhost -p 55432 -U ckan_default -d postgres \
            -c "CREATE DATABASE datastore_test;"
          psql -h localhost -p 55432 -U ckan_default -d postgres \
            -c "CREATE USER datastore_default WITH PASSWORD 'pass';"

      - name: Initialize CKAN test database
        env:
          CKAN_INI: test.ini
        run: |
          mkdir -p /tmp/ckan_test_storage
          ckan -c test.ini db init

      - name: Run full test suite (unit + CKAN integration)
        env:
          CKAN_INI: test.ini
        run: pytest ckanext/native_cloud_storage/tests/ -v
