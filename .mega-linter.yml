# MegaLinter configuration
# https://megalinter.io/latest/configuration/

# Apply auto-fixes for all supported linters
APPLY_FIXES: all
APPLY_FIXES_EVENT: pull_request
APPLY_FIXES_MODE: pull_request

# Reporters
REPORTERS:
  - GitHub
  - SARIF
  - Text

# MegaLinter flavour: use the full image (no flavour restriction)
# Disable suggestions for flavour optimization (keep CI simple)
FLAVOR_SUGGESTIONS: false

# Git-related settings
VALIDATE_ALL_CODEBASE: false # only lint changed files on PRs

# Disable spell-check for now (too many false positives in code)
SPELL_CSPELL_DISABLE_ERRORS: true

# Trivy: informational only (errors handled by CodeQL)
REPOSITORY_TRIVY_DISABLE_ERRORS: true
# Checkov findings are informational only (warnings); they do not block CI
REPOSITORY_CHECKOV_DISABLE_ERRORS: true
# This repository ships CKAN extension sources without CKAN runtime installed in
# lint containers, and includes emulator key fixtures for local development.
# Keep these linters informational to avoid false-negative CI failures.
PYTHON_PYLINT_DISABLE_ERRORS: true
REPOSITORY_SECRETLINT_DISABLE_ERRORS: true
PYTHON_MYPY_DISABLE_ERRORS: true
PYTHON_PYRIGHT_DISABLE_ERRORS: true
# Formatting/style and lightweight static checks are currently advisory-only
# while the extension is being stabilized.
PYTHON_FLAKE8_DISABLE_ERRORS: true
PYTHON_RUFF_DISABLE_ERRORS: true
YAML_V8R_DISABLE_ERRORS: true
# Security and content linters report known fixture/demo values in this repo.
PYTHON_BANDIT_DISABLE_ERRORS: true
REPOSITORY_GITLEAKS_DISABLE_ERRORS: true
SPELL_LYCHEE_DISABLE_ERRORS: true
HTML_HTMLHINT_DISABLE_ERRORS: true

# Upload SARIF to GitHub Security tab (see lint.yml for the upload step)
SARIF_REPORTER: true
